[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pace-sarcasm"
version = "0.1.0"
description = "Progressive Adaptation through Curated Experience for multimodal sarcasm detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openai>=1.68,<3",
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
data = [
  "datasets>=3.2,<5",
  "numpy>=2.0,<3",
  "Pillow>=10,<13",
  "pyarrow>=18,<23",
  "scikit-learn>=1.5,<2",
]
train = [
  "accelerate>=1.2,<3",
  "peft>=0.14,<1",
  "qwen-vl-utils>=0.0.10,<1",
  "safetensors>=0.4,<1",
  "torch>=2.7,<3",
  "transformers>=4.57,<6",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
pace = "pace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

