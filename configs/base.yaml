run:
  name: pace
  seed: 42
  profile: extended
  artifacts_root: /home/yjt/PACE/artifacts

paths:
  datasets_root: /home/yjt/PACE/datasets
  mmsd2_config: mmsd-v2
  model_2b: /home/yjt/model/Qwen3-VL-2B-Instruct
  model_4b: /home/yjt/model/Qwen3-VL-4B-Instruct
  model_8b: /home/yjt/model/Qwen3-VL-8B-Instruct
  retrieval_model: /home/yjt/model/siglip2-so400m-patch14-384

data:
  extraction_ratio: 0.60
  consolidation_ratio: 0.20
  opd_ratio: 0.20
  smoke_extraction_per_source_class: 4
  smoke_consolidation_per_source_class: 64
  smoke_opd_per_source_class: 16

api:
  selected_provider: micu
  max_attempts: 3
  timeout_seconds: 180.0
  temperature: 0.0
  stream: false
  per_key_concurrency: 1
  global_concurrency: null
  providers:
    micu:
      base_url: https://www.micuapi.ai/v1
      model: gpt-5.5
      key_file: /home/yjt/PACE/apikey/gpt_apikey
      supports_json_schema: null
      supports_vision: null
    siliconflow:
      base_url: https://api.siliconflow.cn/v1
      model: Qwen/Qwen3.5-397B-A17B
      key_file: /home/yjt/PACE/apikey/qwen_apikey
      supports_json_schema: true
      supports_vision: true

curation:
  batch_size: null
  global_bank_size: 64
  relevant_per_class_k: 10
  allow_bank_overlap: true
  image_embedding_weight: 0.5
  text_embedding_weight: 0.5

b0:
  profile: extended
  targets_per_source_class:
    smoke: 8
    pilot: 64
    full: 128
    extended: 256
  balance_sources: true
  balance_classes: true
  balance_sarcnet_languages: true

context:
  include_all_experiences: true
  allow_truncation: false
  overflow_strategy: error
  warning_ratios: [0.80, 0.90, 0.95]
  response_reserve_tokens: 256
  safety_margin_tokens: 512

training:
  dtype: bfloat16
  epochs: 3
  micro_batch_size: 1
  sft_gradient_accumulation: 8
  opd_gradient_accumulation: 4
  full_sft_learning_rate: 0.00002
  lora_sft_learning_rate: 0.0002
  full_opd_learning_rate: 0.00001
  lora_opd_learning_rate: 0.0001
  scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_sequence_length: 8192
  max_new_tokens: 256
  gradient_clip_norm: 1.0
  rollout_temperature: 1.0
  rollout_top_p: 1.0
  keep_invalid_rollouts: true
  gold_ce_weight: 1.0
  lora_rank: 32
  lora_alpha: 64
  lora_dropout: 0.05

evaluation:
  generation_temperature: 0.0
  invalid_json_is_incorrect: true
  checkpoint_metric: mean_source_macro_f1

